services:
  api:
    build:
      context: .
      target: base
    environment:
      AWS_REGION: ${AWS_REGION}
      SWIPES_TABLE: ${SWIPES_TABLE}
      MATCHES_TABLE: ${MATCHES_TABLE}
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always
